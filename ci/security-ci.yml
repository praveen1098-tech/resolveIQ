name: ResolveIQ Security & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-tests:
    name: Automated Security Audit & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pytest

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit

      - name: Secrets Leak Detection
        run: |
          if git log -n 5 --pretty=format:%B | grep -iE 'sk-|gsk_|key=|secret=|password='; then
            echo "❌ Suspicious secret patterns detected in recent commits!"
            exit 1
          fi
          echo "✅ No plaintext secrets detected in git logs."

      - name: Execute Full Enterprise Test Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          HINDSIGHT_BASE_URL: "https://api.hindsight.vectorize.io"
          HINDSIGHT_BANK_ID: "resolveiq"
        run: |
          pytest -v tests/
